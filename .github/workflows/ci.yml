name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e .
          pip install pytest

      - name: Test
        run: python -m pytest tests/ -q

  # The cross-GPU determinism claim cannot be tested in hosted CI -- it needs
  # two physically different GPU architectures. This job only verifies that the
  # experiment's preflight check correctly refuses to run rather than silently
  # producing a meaningless "result".
  preflight-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e .
      - name: Cross-GPU experiment must decline to run without 2 GPUs
        run: |
          python benchmarks/prove_cross_gpu.py | tee out.txt
          grep -q "Need 2 GPUs" out.txt
